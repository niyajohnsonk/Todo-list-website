<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      background-color: #000B58;
      font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      color: #FFF4B7;
    }

    .container {
      max-width: 600px;
      margin: 5rem auto;
      padding: 2rem;
      background-color: #003161;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1s ease-in;
    }

    .jumbotron {
      background-color: #003161;
      color: #FFF4B7;
      padding: 2rem;
      border-radius: 20px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .btn-custom {
      font-size: 1.25rem;
      padding: 12px 28px;
      transition: all 0.3s ease;
      border-radius: 10px;
      border: none;
    }

    .btn-signup {
      background-color: #006A67;
      color: #FFF4B7;
    }

    .btn-signup:hover {
      background-color: #00524F;
    }

    .btn-login {
      background-color: #FFF4B7;
      color: #003161;
    }

    .btn-login:hover {
      background-color: #e6db98;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container text-center">
    <div class="jumbotron">
      <h1>Welcome to Your ToDo List!</h1>
      <p class="lead">Save and remember your tasks with ease.</p>
    </div>

    <div class="buttons">
      <button type="button" id="signupBtn" class="btn btn-custom btn-signup">Signup</button>
      <button type="button" id="loginBtn" class="btn btn-custom btn-login">Login</button>
    </div>
  </div>

  <script>
    // jQuery for button animation
    $(document).ready(function () {
      $("#signupBtn").click(function () {
        $(this).text("Redirecting...");
        setTimeout(() => {
          window.location.href = "signup.php";
        }, 500);
      });

      $("#loginBtn").click(function () {
        $(this).text("Redirecting...");
        setTimeout(() => {
          window.location.href = "login.php";
        }, 500);
      });
    });
  </script>

</body>

</html>
